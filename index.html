<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Westlake Thunder 8th Grade — Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep: #0a1c34;
    --navy: #0f2a4a;
    --navy-line: #2c5490;
    --carolina: #6fb8e6;
    --carolina-deep: #3d84b8;
    --gold: #c9a758;
    --gold-deep: #8a6d2c;
    --whistle-red: #c1443c;
    --chalk: #eef3f9;
    --chalk-dim: #a9bcd4;
    --card: #f7f9fc;
    --card-border: #d3dbe6;
    --ink: #16233a;
    --focus: #6fb8e6;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--navy-deep);
    background-image:
      radial-gradient(ellipse at top left, rgba(111,184,230,0.08), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(201,167,88,0.06), transparent 55%);
    background-attachment: fixed;
    color: var(--chalk);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:1750px;margin:0 auto;padding:18px 20px 60px;}

  /* ---------- HEADER ---------- */
  header.top{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    padding-bottom:16px;margin-bottom:18px;border-bottom:3px solid var(--gold);
  }
  .title-block{display:flex;align-items:center;gap:12px;}
  .bolt{flex:0 0 auto;}
  .title-block h1{
    font-family:'Anton',sans-serif;font-weight:400;letter-spacing:0.5px;
    font-size:clamp(24px,3.2vw,38px);margin:0;line-height:1;color:var(--chalk);
    text-transform:uppercase;
  }
  .title-block .sub{color:var(--chalk-dim);font-size:13px;margin-top:4px;letter-spacing:0.4px;}
  .coach-box{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.2);border:1px solid var(--navy-line);padding:8px 10px;border-radius:var(--radius);}
  .coach-box label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--chalk-dim);}
  .coach-box input{
    background:var(--card);color:var(--ink);border:1px solid var(--card-border);border-radius:6px;
    padding:6px 8px;font-size:14px;font-family:inherit;width:150px;
  }
  .coach-box input:focus{outline:2px solid var(--focus);outline-offset:1px;}
  .coach-box select{
    background:var(--card);color:var(--ink);border:1px solid var(--card-border);border-radius:6px;
    padding:6px 8px;font-size:13px;font-family:inherit;
  }
  .coach-box select:disabled{opacity:0.65;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;
    border-radius:7px;border:1px solid var(--navy-line);background:var(--navy);color:var(--chalk);
    padding:9px 13px;cursor:pointer;transition:transform .08s ease, background .15s ease;
  }
  button:hover{background:#173a63;}
  button:active{transform:scale(0.97);}
  button.primary{background:var(--gold);border-color:var(--gold-deep);color:#241a06;}
  button.primary:hover{background:#d8b968;}
  button.ghost{background:transparent;}
  .modal button.ghost{color:var(--ink);border-color:var(--card-border);}
  .modal button.ghost:hover{background:#eaeef4;}
  button.cancel{background:var(--whistle-red);border-color:#8f2f29;color:#fff;}
  button.cancel:hover{background:#d4544b;}
  button.small{padding:4px 8px;font-size:11px;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--focus);outline-offset:2px;
  }

  /* ---------- LAYOUT ---------- */
  .board{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  .teams-area{flex:1 1 900px;display:flex;flex-direction:column;gap:14px;}
  .teams-toolbar{display:flex;gap:8px;justify-content:flex-end;}
  .teams-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px,1fr));gap:14px;align-items:start;}
  .pool-col{flex:0 0 320px;min-width:270px;}

  .col-panel{
    background:rgba(0,0,0,0.2);border:1px solid var(--navy-line);border-radius:12px;
    display:flex;flex-direction:column;max-height: 78vh;
  }
  .col-panel.team-locked{border:2px solid #3ecf6c;box-shadow:0 0 0 1px rgba(62,207,108,0.35);}
  .locked-banner{
    background:#1f7a41;color:#eafff0;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
    padding:6px 14px;letter-spacing:0.3px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  }
  .locked-banner .when{font-weight:500;opacity:0.85;}
  .lock-btn{white-space:nowrap;}
  .lock-btn.locked{background:#1f7a41;border-color:#144f2b;color:#eafff0;}
  .lock-btn.locked:hover{background:#26904e;}
  .col-head{padding:12px 14px 10px;border-bottom:2px solid rgba(255,255,255,0.08);}
  .col-head .name-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .col-head h2{
    font-family:'Anton',sans-serif;font-weight:400;font-size:19px;letter-spacing:0.4px;margin:0;
    text-transform:uppercase;color:var(--chalk);
  }
  .col-head .coach-name{
    font-size:12.5px;color:var(--carolina);font-weight:600;display:block;margin-top:1px;
  }
  .pick-order{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);white-space:nowrap;}
  .count-line{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12px;color:var(--chalk-dim);flex-wrap:wrap;}
  .count-pill{
    font-family:'IBM Plex Mono',monospace;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,0.08);
  }
  .count-pill.warn{background:var(--whistle-red);color:#fff;}
  .count-pill.low{background:rgba(201,167,88,0.28);color:var(--gold);}
  .tag-count{font-family:'IBM Plex Mono',monospace;}
  .collapse-toggle{margin-left:auto;}
  .col-body{
    padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;min-height:80px;
  }
  .col-body.dragover{background:rgba(201,167,88,0.14);outline:2px dashed var(--gold);outline-offset:-4px;}
  .col-panel.collapsed .col-body{display:none;}
  .col-panel.collapsed{max-height:none;}
  .empty-hint{color:var(--chalk-dim);font-size:12px;text-align:center;padding:18px 6px;font-style:italic;}

  .pool-tools{display:flex;flex-direction:column;gap:6px;padding:0 2px 10px;}
  .pool-tools input[type=text]{
    width:100%;padding:8px 9px;border-radius:7px;border:1px solid var(--card-border);
    font-family:inherit;font-size:13px;background:var(--card);color:var(--ink);
  }
  .pool-tools select{
    width:100%;padding:7px 8px;border-radius:7px;border:1px solid var(--card-border);
    font-family:inherit;font-size:12px;background:var(--card);color:var(--ink);
  }

  /* ---------- PLAYER CARD ---------- */
  .card{
    background:var(--card);color:var(--ink);border:1px solid var(--card-border);border-radius:7px;
    padding:5px 8px;cursor:grab;position:relative;box-shadow:0 1px 0 rgba(0,0,0,0.15);
  }
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:0.4;}
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:6px;padding-right:38px;}
  .card-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .card-name{font-weight:700;font-size:13px;line-height:1.15;}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;padding:1px 4px;border-radius:4px;
    letter-spacing:0.3px;white-space:nowrap;
  }
  .badge.new{background:var(--carolina-deep);color:#eaf6ff;}
  .badge.returning{background:#3d5a3d;color:#eaffea;}
  .badge.xman{background:var(--whistle-red);color:#fff;}
  .positions-inline{font-size:10px;color:#5b5548;white-space:nowrap;flex:0 0 auto;padding-left:6px;}
  .stat-row{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#584f3d;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;
  }
  .notes-row{font-size:10.5px;color:#5b5548;margin-top:4px;font-style:italic;}
  .extra-info{display:none;}
  .extra-info.open{display:block;}
  .pref-row{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}
  .pref-pill{
    font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;border-radius:5px;padding:1px 4px;
    border:1px solid #c3cad6;background:#eaeef4;color:#6b7688;cursor:pointer;user-select:none;
  }
  .pref-pill.want{background:var(--gold);border-color:var(--gold-deep);color:#241a06;}
  .pref-pill.bubble{background:#e7dcb8;border-color:var(--gold-deep);color:#5c4413;}
  .pref-pill.pill-locked{opacity:0.55;cursor:not-allowed;}
  .status-row{margin-top:5px;}
  .status-btn{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;
    border:1px solid;cursor:pointer;letter-spacing:0.2px;
  }
  .status-btn.signed{background:var(--gold);border-color:var(--gold-deep);color:#241a06;}
  .status-btn.considered{background:#ff2d2d;border-color:#8f2f29;color:#fff;}
  .status-btn:hover{filter:brightness(1.08);}
  .card.want-pick{border-left:4px solid var(--gold);}
  .card.bubble-pick{border:3px solid #ff2d2d;box-shadow:0 0 0 1px rgba(255,45,45,0.35);}
  .card-actions{position:absolute;top:4px;right:4px;display:flex;gap:2px;}
  .edit-dot, .expand-toggle{
    background:none;border:none;color:#8a8267;font-size:14px;padding:0 3px;cursor:pointer;line-height:1;
  }
  .edit-dot:hover, .expand-toggle:hover{color:#1b2420;}

  /* ---------- MODALS ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,14,26,0.7);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal{
    background:var(--card);color:var(--ink);border-radius:12px;max-width:480px;width:100%;
    max-height:85vh;overflow-y:auto;padding:20px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .modal h3{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;margin:0 0 14px;font-size:20px;letter-spacing:0.4px;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:#5b5548;margin-bottom:3px;}
  .field input, .field select, .field textarea{
    width:100%;padding:8px 9px;border-radius:6px;border:1px solid var(--card-border);font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:50px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pos-check-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .pos-check{
    font-size:12px;border:1px solid var(--card-border);border-radius:16px;padding:4px 10px;cursor:pointer;background:#eaeef4;
    user-select:none;
  }
  .pos-check.on{background:var(--navy);color:var(--chalk);border-color:var(--navy);}
  .pos-check.uncertain{background:#fff;border:2px dashed var(--navy);color:var(--navy);font-style:italic;}
  .modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;}
  .modal-actions .right{display:flex;gap:8px;}
  button.danger{background:var(--whistle-red);border-color:#8f2f29;color:#fff;}
  button.danger:hover{background:#d4544b;}

  .import-textarea{width:100%;min-height:160px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:10px;border-radius:8px;border:1px solid var(--card-border);}
  .photo-row{display:flex;gap:12px;align-items:center;}
  .photo-preview{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--card-border);background:#eaeef4;}
  .photo-controls{display:flex;flex-direction:column;gap:6px;}
  .photo-controls input[type=file]{font-size:11.5px;}

  /* ---------- LOG PANEL ---------- */
  .log-panel{
    position:fixed;top:0;right:0;height:100vh;width:340px;max-width:90vw;background:#0b1e36;
    border-left:2px solid var(--navy-line);z-index:60;transform:translateX(100%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .log-panel.open{transform:translateX(0);}
  .log-head{padding:14px 16px;border-bottom:1px solid var(--navy-line);display:flex;justify-content:space-between;align-items:center;}
  .log-head h3{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;margin:0;font-size:18px;}
  .log-body{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px;}
  .log-entry{border-bottom:1px solid rgba(255,255,255,0.07);padding-bottom:8px;font-size:12.5px;}
  .log-entry .who{font-weight:700;color:var(--gold);}
  .log-entry .when{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--chalk-dim);display:block;margin-top:2px;}
  .status-msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--chalk);
    padding:8px 16px;border-radius:20px;font-size:12.5px;border:1px solid var(--navy-line);z-index:80;opacity:0;
    transition:opacity .3s ease;pointer-events:none;}
  .status-msg.show{opacity:1;}

  .loading-note{color:var(--chalk-dim);font-size:13px;padding:30px;text-align:center;}

  /* ---------- TABLE VIEW ---------- */
  .table-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--chalk-dim);}
  .table-scroll{overflow-x:auto;border:1px solid var(--navy-line);border-radius:10px;background:rgba(0,0,0,0.18);}
  table.player-table{width:100%;border-collapse:collapse;font-size:12.5px;color:var(--chalk);}
  table.player-table thead th{background:var(--navy);padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--navy-line);}
  table.player-table th.sortable{cursor:pointer;user-select:none;}
  table.player-table th.sortable:hover{background:#173a63;}
  table.player-table thead tr.filter-row th{background:var(--navy-deep);padding:4px 6px;}
  table.player-table thead tr.filter-row input, table.player-table thead tr.filter-row select{
    width:100%;font-size:11px;padding:3px 5px;border-radius:4px;border:1px solid var(--card-border);background:var(--card);color:var(--ink);
  }
  table.player-table tbody tr{cursor:pointer;}
  table.player-table tbody tr:nth-child(even){background:rgba(255,255,255,0.03);}
  table.player-table tbody tr:hover{background:rgba(201,167,88,0.14);}
  table.player-table td{padding:6px 10px;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,0.06);}
  table.player-table td.wrap-cell{white-space:normal;max-width:220px;}

  /* ---------- PASSWORD GATE ---------- */
  .password-gate{
    position:fixed;inset:0;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;
    z-index:999;padding:20px;
  }
  .password-box{
    background:var(--card);color:var(--ink);border-radius:14px;max-width:340px;width:100%;
    padding:30px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  .password-box h2{
    font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;margin:0 0 6px;font-size:22px;letter-spacing:0.4px;
  }
  .password-box p{font-size:13px;color:#5b5548;margin:0 0 16px;}
  .password-box input{
    width:100%;padding:10px 11px;border-radius:7px;border:1px solid var(--card-border);font-family:inherit;
    font-size:14px;margin-bottom:10px;background:#fff;color:var(--ink);text-align:center;
  }
  .password-box button{width:100%;}
  .pw-error{color:var(--whistle-red);font-size:12.5px;margin-top:10px;font-weight:600;}

  @media (max-width:900px){
    .board{flex-direction:column;}
    .pool-col{flex-basis:auto;width:100%;}
    .col-panel{max-height:50vh;}
  }
</style>
</head>
<body>
<div class="password-gate" id="passwordGate">
  <div class="password-box">
    <svg width="26" height="34" viewBox="0 0 26 34" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:8px;">
      <path d="M16 0L2 20H12L9 34L24 12H14L16 0Z" fill="#c9a758"/>
    </svg>
    <h2>Thunder Draft Board</h2>
    <p>Enter the coach access password to continue.</p>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off" />
    <button class="primary" id="pwSubmit">Enter</button>
    <div class="pw-error" id="pwError" style="display:none;">Incorrect password. Try again.</div>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <div class="title-block">
      <svg class="bolt" width="26" height="34" viewBox="0 0 26 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 0L2 20H12L9 34L24 12H14L16 0Z" fill="#c9a758"/>
      </svg>
      <div>
        <h1>Thunder Draft Board</h1>
        <div class="sub">Westlake 8th Grade Football · Pick order: A1 (Crane) → A2 (Crowther) → B1 (Moore) ⇄ B1(2) (Willes)</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
      <div class="coach-box">
        <label for="coachInput">Editing as</label>
        <input id="coachInput" type="text" placeholder="Your name" />
        <label for="affiliationSelect">Team</label>
        <select id="affiliationSelect">
          <option value="">Select…</option>
          <option value="A1">A1 – Crane</option>
          <option value="A2">A2 – Crowther</option>
          <option value="B1">B1 – Moore</option>
          <option value="B1-2">B1(2) – Willes</option>
          <option value="other">Other / League</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="primary" id="addPlayerBtn">+ Add player</button>
        <button id="importBtn">Import list</button>
        <button id="tableViewBtn">Table view</button>
        <button id="logBtn">Change log</button>
      </div>
    </div>
  </header>

  <div id="loadingNote" class="loading-note">Loading roster…</div>
  <div class="board" id="board" style="display:none;"></div>
  <div id="tableViewWrap" style="display:none;"></div>
</div>

<div id="modalRoot"></div>
<div class="log-panel" id="logPanel">
  <div class="log-head">
    <h3>Change log</h3>
    <button class="ghost" id="closeLogBtn">Close ✕</button>
  </div>
  <div class="log-body" id="logBody"></div>
</div>
<div class="status-msg" id="statusMsg"></div>

  function resizeImageFile(file, maxDim){
    maxDim = maxDim || 320;
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h){ if(w > maxDim){ h = Math.round(h * (maxDim / w)); w = maxDim; } }
          else { if(h > maxDim){ w = Math.round(w * (maxDim / h)); h = maxDim; } }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------------- STORAGE ----------------
  async function loadAll(){
    try{
      const p = await window.storage.get('players', true);
      players = p && p.value ? JSON.parse(p.value) : seedPlayers();
    }catch(e){
      players = seedPlayers();
      try{ await window.storage.set('players', JSON.stringify(players), true); }catch(e2){}
    }
    try{
      const l = await window.storage.get('draft_log', true);
      log = l && l.value ? JSON.parse(l.value) : [];
    }catch(e){ log = []; }

    try{
      const tl = await window.storage.get('team_locks', true);
      teamLocks = tl && tl.value ? JSON.parse(tl.value) : {};
    }catch(e){ teamLocks = {}; }

    try{
      const c = await window.storage.get('coach_name', false);
      coachName = c && c.value ? c.value : '';
    }catch(e){ coachName = ''; }
    $('#coachInput').value = coachName;

    try{
      const a = await window.storage.get('coach_affiliation', false);
      coachAffiliation = a && a.value ? a.value : '';
    }catch(e){ coachAffiliation = ''; }
    updateAffiliationUI();
  }

  function updateAffiliationUI(){
    const sel = $('#affiliationSelect');
    const matched = matchMainCoach(coachName);
    if(matched){
      sel.value = matched;
      sel.disabled = true;
      coachAffiliation = matched;
    } else {
      sel.disabled = false;
      sel.value = coachAffiliation || '';
    }
  }

  function hasIdentity(){
    if(!coachName || !coachName.trim()) return false;
    const matched = matchMainCoach(coachName);
    if(!matched && !coachAffiliation) return false;
    return true;
  }

            </div>
          </div>
        </div>

    `;
    function refreshAffVisibility(){
      const matched = matchMainCoach($('#welcome-name').value);
      $('#welcome-aff-field').style.display = matched ? 'none' : 'block';
    }
    refreshAffVisibility();
    $('#welcome-name').addEventListener('input', refreshAffVisibility);
    $('#welcome-name').focus();

      const name = $('#welcome-name').value.trim();
      if(!name){ showStatus('Enter your name to continue'); $('#welcome-name').focus(); return; }
      const matched = matchMainCoach(name);
      let aff = matched;

        aff = $('#welcome-affiliation').value;

  function getLoggedName(){
    const matched = matchMainCoach(coachName);
    const name = coachName.trim() || 'Unknown coach';
    if(matched) return name;
    if(coachAffiliation === 'other') return `${name} [Other/League]`;
    const t = TEAMS.find(tt=>tt.key===coachAffiliation);
    return t ? `${name} [${t.label}]` : name;
  }

  // ---------------- RENDER ----------------
  function playerMatchesFilter(p){
    if(filterStatus !== 'all' && p.status !== filterStatus) return false;
    if(filterPos !== 'all' && !(p.positions||[]).includes(filterPos)) return false;
    if(filterText.trim()){
      const q = filterText.trim().toLowerCase();
      if(!p.name.toLowerCase().includes(q)) return false;
    }
    return true;
  }

  function statLine(p){
    const parts = [];
    if(p.height) parts.push('HT ' + p.height);
    if(p.weight) parts.push('WT ' + p.weight);
    if(p.speed40) parts.push('40y ' + p.speed40 + 's');
    if(p.vertical) parts.push('VJ ' + p.vertical + '"');
    if(p.shuttle) parts.push('SH ' + p.shuttle + 's');
    return parts.join('  ·  ');
  }

  function isXMan(p){
    const w = parseFloat(p.weight);
    return !isNaN(w) && w > 165;
  }

    if(!state) return 'want';

    const card = document.createElement('div');
    const onTeamPref = (p.team !== 'pool' && p.prefs) ? p.prefs[p.team] : null;

    card.draggable = !cardTeamLocked;
    if(cardTeamLocked) card.title = `${teamDisplayLabel(p.team)} is locked in — unlock it first to move this player`;
    card.dataset.id = p.id;

    const isExpanded = expandedCards.has(p.id);
    const posStr = (p.positions||[]).join(', ');
    let prefsHtml = '';
    TEAMS.forEach(t=>{
      if(p.team === t.key) return; // own-team status is shown via the prominent Signed/Considered toggle instead
      const state = p.prefs && p.prefs[t.key];
      const cls = state === 'want' ? 'want' : state === 'bubble' ? 'bubble' : '';
      const pillLocked = isTeamLocked(t.key);
      const label = state === 'want' ? '★ ' + t.label : state === 'bubble' ? '? ' + t.label : t.label;
      const lockTitle = pillLocked ? `${t.label} is locked in` : `Click to cycle ${t.label} interest: none → want → bubble`;
      prefsHtml += `<span class="pref-pill ${cls}${pillLocked ? ' pill-locked' : ''}" data-team="${t.key}" title="${lockTitle}">${label}</span>`;
    });

    const onOwnTeam = p.team !== 'pool';
    const isConsidered = onOwnTeam && onTeamPref === 'bubble';
    const statusLabel = isConsidered ? '? Considered' : '✓ Signed';
    const statusCls = isConsidered ? 'considered' : 'signed';

    const hasExtra = !!(statLine(p) || p.notes);
    const xman = isXMan(p);
    card.innerHTML = `
      <div class="card-actions">
        ${hasExtra ? `<button class="expand-toggle" title="${isExpanded ? 'Show less' : 'Show more'}">${isExpanded ? '▴' : '▾'}</button>` : ''}
        <button class="edit-dot" title="Edit player">⋯</button>
      </div>
      <div class="card-top">
        <div class="card-name-row">
          <span class="card-name">${escapeHtml(p.name)}</span>
          <span class="badge ${p.status}">${p.status === 'new' ? 'NEW' : 'RETURNING'}</span>
          ${xman ? `<span class="badge xman" title="Over 165 lb — 8th grade X-Man rule: offensive line only on offense">X-MAN</span>` : ''}
        </div>
        ${posStr ? `<span class="positions-inline">${escapeHtml(posStr)}</span>` : ''}
      </div>
      ${onOwnTeam ? `<div class="status-row"><button class="status-btn ${statusCls}" title="Click to switch between Signed and Considered">${statusLabel}</button></div>` : ''}
      <div class="pref-row">${prefsHtml}</div>
      <div class="extra-info${isExpanded ? ' open' : ''}">
        ${statLine(p) ? `<div class="stat-row">${escapeHtml(statLine(p))}</div>` : ''}
        ${p.notes ? `<div class="notes-row">${escapeHtml(p.notes)}</div>` : ''}
      </div>
    `;

    card.addEventListener('dragstart', (e)=>{
      draggingId = p.id;
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', p.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); draggingId = null; });

    $('.edit-dot', card).addEventListener('click', (e)=>{ e.stopPropagation(); openEditModal(p.id); });

    const expandBtn = $('.expand-toggle', card);
    if(expandBtn){
      expandBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(expandedCards.has(p.id)) expandedCards.delete(p.id); else expandedCards.add(p.id);
        renderBoard();
      });
    }

    const statusBtn = $('.status-btn', card);
    if(statusBtn){
      statusBtn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(isTeamLocked(p.team)){
          showStatus(`${teamDisplayLabel(p.team)} is locked in — unlock it first to change status`);
          return;
        }
        const player = players.find(pp=>pp.id===p.id);
        if(!player.prefs) player.prefs = {};
        const next = player.prefs[player.team] === 'bubble' ? 'want' : 'bubble';
        player.prefs[player.team] = next;
        await savePlayers();
        addLog(`marked ${player.name} as ${next === 'want' ? 'Confirmed/Signed' : 'Bubble/Considered'} on ${teamDisplayLabel(player.team)}`);
        renderBoard();
      });
    }

    $all('.pref-pill', card).forEach(pill=>{
      pill.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const teamKey = pill.dataset.team;
        if(isTeamLocked(teamKey)){
          showStatus(`${teamDisplayLabel(teamKey)} is locked in — unlock it first to change tags`);
          return;
        }
        const player = players.find(pp=>pp.id===p.id);
        if(!player.prefs) player.prefs = {};
        const newState = cyclePref(player.prefs[teamKey]);
        if(newState) player.prefs[teamKey] = newState; else delete player.prefs[teamKey];
        await savePlayers();
        addLog(`marked ${player.name} as ${newState ? newState.toUpperCase() : 'no preference'} for ${teamKey}`);
        renderBoard();
      });
    });

    return card;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderBoard(){
    const board = $('#board');
    board.innerHTML = '';

    // ---- TEAMS AREA (left, main) ----
    const teamsArea = document.createElement('div');
    teamsArea.className = 'teams-area';

    const toolbar = document.createElement('div');
    toolbar.className = 'teams-toolbar';
    toolbar.innerHTML = `<button class="small" id="expandAllBtn">Expand all</button><button class="small" id="collapseAllBtn">Minimize all</button>`;
    teamsArea.appendChild(toolbar);

    const teamsGrid = document.createElement('div');
    teamsGrid.className = 'teams-grid';
    TEAMS.forEach(t=>{
      const teamPlayers = players.filter(p=>p.team===t.key && playerMatchesFilter(p));
      teamPlayers.sort((a,b)=>{
        const ab = (a.prefs && a.prefs[t.key]==='bubble') ? 1 : 0;
        const bb = (b.prefs && b.prefs[t.key]==='bubble') ? 1 : 0;
        return ab - bb;
      });
      const total = players.filter(p=>p.team===t.key).length;
      const wantCount = players.filter(p=>p.team===t.key && p.prefs && p.prefs[t.key]==='want').length;
      const bubbleCount = players.filter(p=>p.team===t.key && p.prefs && p.prefs[t.key]==='bubble').length;
      let countClass = '';
      if(total > t.max) countClass = 'warn';
      else if(total < t.min) countClass = 'low';
      const isCollapsed = !!collapsedTeams[t.key];
      const lockInfo = teamLocks[t.key];
      const isLocked = !!(lockInfo && lockInfo.locked);

      const col = document.createElement('div');
      col.className = 'col-panel' + (isCollapsed ? ' collapsed' : '') + (isLocked ? ' team-locked' : '');
      col.innerHTML = `
        <div class="col-head">
          <div class="name-row">
            <div>
              <h2>${t.label}</h2>
              <span class="coach-name">${t.coach}</span>
            </div>
            <span class="pick-order">${t.order}</span>
          </div>
          <div class="count-line">
            <span class="count-pill ${countClass}">${total}</span>
            <span class="tag-count">✓ ${wantCount} signed</span>
            <span class="tag-count">? ${bubbleCount} considered</span>
            <button class="small ghost lock-btn${isLocked ? ' locked' : ''}" data-team="${t.key}">${isLocked ? '🔒 Locked — Unlock' : '🔓 Lock in team'}</button>
            <button class="small ghost collapse-toggle" data-team="${t.key}">${isCollapsed ? 'Maximize ▾' : 'Minimize ▴'}</button>
          </div>
        </div>
        ${isLocked ? `<div class="locked-banner"><span>✅ FINALIZED by ${escapeHtml(lockInfo.by || 'a coach')}</span><span class="when">${formatWhen(lockInfo.at)}</span></div>` : ''}
        <div class="col-body" id="col-${t.key}"></div>
      `;
      teamsGrid.appendChild(col);
      const body = $(`#col-${t.key}`, col);
      if(teamPlayers.length===0){ body.innerHTML = '<div class="empty-hint">Drag players here.</div>'; }
      teamPlayers.forEach(p=> body.appendChild(renderCard(p)));
      setupDropzone(body, t.key);

      $('.collapse-toggle', col).addEventListener('click', ()=>{
        collapsedTeams[t.key] = !collapsedTeams[t.key];
        renderBoard();
      });

      $('.lock-btn', col).addEventListener('click', async ()=>{
        if(isLocked){
          delete teamLocks[t.key];
          await saveTeamLocks();
          addLog(`unlocked ${t.label}'s roster`);
        } else {
          teamLocks[t.key] = { locked: true, by: getLoggedName(), at: new Date().toISOString() };
          await saveTeamLocks();
          addLog(`locked in ${t.label}'s roster as finalized`);
        }
        renderBoard();
      });
    });
    teamsArea.appendChild(teamsGrid);
    board.appendChild(teamsArea);

    $('#expandAllBtn', toolbar).addEventListener('click', ()=>{ collapsedTeams = {}; renderBoard(); });
    $('#collapseAllBtn', toolbar).addEventListener('click', ()=>{
      TEAMS.forEach(t=> collapsedTeams[t.key] = true);
      renderBoard();
    });

    // ---- PLAYER POOL (right) ----
    const poolCol = document.createElement('div');
    poolCol.className = 'pool-col';
    const poolPlayers = players.filter(p=>p.team==='pool' && playerMatchesFilter(p));
    poolCol.innerHTML = `
      <div class="col-panel">
        <div class="col-head">
          <div class="name-row"><h2>Player Pool</h2><span class="pick-order">${poolPlayers.length} shown</span></div>
          <div class="pool-tools" style="margin-top:8px;">
            <input type="text" id="searchInput" placeholder="Search name…" value="${escapeHtml(filterText)}"/>
            <select id="statusFilter">
              <option value="all">All players</option>
              <option value="new">New only</option>
              <option value="returning">Returning only</option>
            </select>
            <select id="posFilter">
              <option value="all">All positions</option>
              ${POSITIONS.map(pos=>`<option value="${pos}">${pos}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="col-body" id="col-pool"></div>
      </div>
    `;
    board.appendChild(poolCol);
    const poolBody = $('#col-pool', poolCol);
    if(poolPlayers.length===0){ poolBody.innerHTML = '<div class="empty-hint">No players match. Adjust filters or add players.</div>'; }
    poolPlayers.forEach(p=> poolBody.appendChild(renderCard(p)));
    setupDropzone(poolBody, 'pool');

    $('#searchInput', poolCol).value = filterText;
    $('#searchInput', poolCol).addEventListener('input', e=>{ filterText = e.target.value; renderBoard(); preserveFocus('#searchInput'); });
    $('#statusFilter', poolCol).value = filterStatus;
    $('#statusFilter', poolCol).addEventListener('change', e=>{ filterStatus = e.target.value; renderBoard(); });
    $('#posFilter', poolCol).value = filterPos;
    $('#posFilter', poolCol).addEventListener('change', e=>{ filterPos = e.target.value; renderBoard(); });

    if(currentView === 'table') renderTableView();
  }

  function preserveFocus(sel){
    const el = $(sel);
    if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
  }

  function getColValue(p, key){
    switch(key){
      case 'name': return p.name || '';
      case 'status': return p.status || '';
      case 'team': return p.team || '';
      case 'positions': return (p.positions||[]).join(', ');
      case 'height': return p.height || '';
      case 'weight': return p.weight || '';
      case 'speed40': return p.speed40 || '';
      case 'vertical': return p.vertical || '';
      case 'shuttle': return p.shuttle || '';
      case 'xman': return isXMan(p) ? 'yes' : 'no';
      case 'parentName': return p.parentName || '';
      case 'parentPhone': return p.parentPhone || '';
      case 'parentEmail': return p.parentEmail || '';
      case 'notes': return p.notes || '';
      default: return '';
    }
  }

  function teamDisplayLabel(key){
    if(key === 'pool') return 'Pool';
    const t = TEAMS.find(tt=>tt.key===key);
    return t ? t.label : key;
  }

  function setView(view){
    currentView = view;
    $('#board').style.display = view === 'board' ? 'flex' : 'none';
    $('#tableViewWrap').style.display = view === 'table' ? 'block' : 'none';
    $('#tableViewBtn').textContent = view === 'board' ? 'Table view' : 'Board view';
    if(view === 'table') renderTableView();
  }

  function renderTableView(){
    const wrap = $('#tableViewWrap');
    if(!wrap) return;
    let rows = players.slice();

    TABLE_COLUMNS.forEach(col=>{
      const fval = tableFilters[col.key];
      if(!fval) return;
      rows = rows.filter(p=>{
        const v = String(getColValue(p, col.key)).toLowerCase();
        if(col.type === 'select') return v === fval.toLowerCase();
        return v.includes(fval.toLowerCase());
      });
    });

    rows.sort((a,b)=>{
      const av = getColValue(a, tableSort.col);
      const bv = getColValue(b, tableSort.col);
      const an = parseFloat(av), bn = parseFloat(bv);
      let cmp;
      if(av !== '' && bv !== '' && !isNaN(an) && !isNaN(bn)){
        cmp = an - bn;
      } else {
        cmp = String(av).localeCompare(String(bv));
      }
      return tableSort.dir === 'asc' ? cmp : -cmp;
    });

    const headHtml = '<tr>' + TABLE_COLUMNS.map(col=>{
      const arrow = tableSort.col === col.key ? (tableSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
      return `<th data-col="${col.key}" class="${col.sortable ? 'sortable' : ''}">${escapeHtml(col.label)}${arrow}</th>`;
    }).join('') + '</tr>';

    const filterHtml = '<tr class="filter-row">' + TABLE_COLUMNS.map(col=>{
      if(col.type === 'select'){
        const opts = [{v:'', label:'All'}].concat(col.options.map(o=>({v:o, label: o==='pool' ? 'Pool' : (o.charAt(0).toUpperCase()+o.slice(1))})));
        return `<th><select data-filter-col="${col.key}">${opts.map(o=>`<option value="${o.v}" ${tableFilters[col.key]===o.v ? 'selected' : ''}>${o.label}</option>`).join('')}</select></th>`;
      }
      return `<th><input type="text" data-filter-col="${col.key}" value="${escapeHtml(tableFilters[col.key])}" placeholder="Filter…" /></th>`;
    }).join('') + '</tr>';

    const bodyHtml = rows.map(p=>{
      return `<tr data-id="${p.id}">` + TABLE_COLUMNS.map(col=>{
        let val = getColValue(p, col.key);
        if(col.key === 'team') val = teamDisplayLabel(val);
        else if(col.key === 'status') val = val === 'new' ? 'New' : 'Returning';
        else if(col.key === 'xman') val = val === 'yes' ? 'X-Man' : '';
        const wrapCls = (col.key === 'notes' || col.key === 'positions') ? ' class="wrap-cell"' : '';
        return `<td${wrapCls}>${escapeHtml(String(val))}</td>`;
      }).join('') + '</tr>';
    }).join('');

    wrap.innerHTML = `
      <div class="table-toolbar">
        <span>${rows.length} of ${players.length} players — click a row to open that player's profile</span>
        <button class="small ghost" id="clearTableFilters">Clear filters</button>
      </div>
      <div class="table-scroll">
        <table class="player-table">
          <thead>${headHtml}${filterHtml}</thead>
          <tbody>${bodyHtml || `<tr><td colspan="${TABLE_COLUMNS.length}" class="empty-hint">No players match these filters.</td></tr>`}</tbody>
        </table>
      </div>
    `;

    $all('th.sortable', wrap).forEach(th=>{
      th.addEventListener('click', ()=>{
        const col = th.dataset.col;
        if(tableSort.col === col){ tableSort.dir = tableSort.dir === 'asc' ? 'desc' : 'asc'; }
        else { tableSort.col = col; tableSort.dir = 'asc'; }
        renderTableView();
      });
    });

    $all('[data-filter-col]', wrap).forEach(input=>{
      const evtName = input.tagName === 'SELECT' ? 'change' : 'input';
      input.addEventListener(evtName, (e)=>{
        tableFilters[input.dataset.filterCol] = e.target.value;
        renderTableView();
        if(input.tagName !== 'SELECT'){
          const fresh = wrap.querySelector(`[data-filter-col="${input.dataset.filterCol}"]`);
          if(fresh){ fresh.focus(); const v = fresh.value; fresh.value=''; fresh.value=v; }
        }
      });
    });

    const clearBtn = $('#clearTableFilters', wrap);
    if(clearBtn){
      clearBtn.addEventListener('click', ()=>{
        TABLE_COLUMNS.forEach(c=> tableFilters[c.key] = '');
        renderTableView();
      });
    }

    $all('tbody tr[data-id]', wrap).forEach(tr=>{
      tr.addEventListener('click', ()=> openEditModal(tr.dataset.id));
    });
  }

  function isTeamLocked(teamKey){
    return !!(teamLocks[teamKey] && teamLocks[teamKey].locked);
  }

  function setupDropzone(el, teamKey){
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('dragover'));
    el.addEventListener('drop', async e=>{
      e.preventDefault();
      el.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const player = players.find(p=>p.id===id);
      if(!player) return;
      if(player.team === teamKey) return;
      if(isTeamLocked(teamKey)){
        showStatus(`${teamDisplayLabel(teamKey)} is locked in — unlock it first to make changes`);
        return;
      }
      if(isTeamLocked(player.team)){
        showStatus(`${teamDisplayLabel(player.team)} is locked in — unlock it first to move this player`);
        return;
      }
      const fromTeam = player.team;
      player.team = teamKey;
      if(teamKey !== 'pool'){
        if(!player.prefs) player.prefs = {};
        if(!player.prefs[teamKey]) player.prefs[teamKey] = 'want';
      }
      await savePlayers();
      const toLabel = teamKey === 'pool' ? 'the pool' : teamKey;
      const fromLabel = fromTeam === 'pool' ? 'the pool' : fromTeam;
      addLog(`moved ${player.name} from ${fromLabel} to ${toLabel}`);
      renderBoard();
    });
  }

  // ---------------- LOG PANEL ----------------
  function formatWhen(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
  }

  function renderLog(){
    const body = $('#logBody');
    if(log.length===0){ body.innerHTML = '<div class="empty-hint">No changes yet.</div>'; return; }
    body.innerHTML = log.map(entry=>{
      const when = formatWhen(entry.ts);
      return `<div class="log-entry"><span class="who">${escapeHtml(entry.coach)}</span> ${escapeHtml(entry.action)}<span class="when">${when}</span></div>`;
    }).join('');
  }

  // ---------------- MODALS ----------------
  function closeModal(){ $('#modalRoot').innerHTML = ''; }

    const isNew = !id;
    const p = isNew ? {id:null, name:'', status:'new', team:'pool', positions:[], height:'', weight:'', speed40:'', vertical:'', shuttle:'', notes:'', parentName:'', parentPhone:'', parentEmail:'', prefs:{}} : players.find(pp=>pp.id===id);
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
          <h3>${isNew ? 'Add player' : 'Edit player'}</h3>

              <img id="photoPreview" class="photo-preview" style="display:none;" alt="Player photo" />

                <input type="file" id="f-photo" accept="image/*" />
                <button type="button" class="ghost small" id="removePhotoBtn" style="display:none;">Remove photo</button>
              </div>
            </div>
            <div style="font-size:11px;color:#5b5548;margin-top:4px;">Only shown here when you open this player's profile — never on the roster board.</div>
          </div>
          <div class="field"><label>Name</label><input id="f-name" type="text" value="${escapeHtml(p.name)}" /></div>
          <div class="two-col">

              <select id="f-status">
                <option value="new" ${p.status==='new'?'selected':''}>New</option>
                <option value="returning" ${p.status==='returning'?'selected':''}>Returning</option>
              </select>
            </div>
            <div class="field"><label>Current team</label>
              <select id="f-team">
                <option value="pool" ${p.team==='pool'?'selected':''}>Pool (unassigned)</option>
                ${TEAMS.map(t=>`<option value="${t.key}" ${p.team===t.key?'selected':''}>${t.label} — ${t.coach}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="field"><label>Positions played</label>
            <div style="font-size:11.5px;color:#5b5548;margin-bottom:5px;">Tap once for confirmed, tap again for potential/unsure (shows with *), tap again to clear.</div>
            <div class="pos-check-grid" id="posGrid">
              ${POSITIONS.map(pos=>{
                const uncertain = (p.positions||[]).includes(pos+'*');
                const on = !uncertain && (p.positions||[]).includes(pos);
                const cls = on ? 'on' : uncertain ? 'uncertain' : '';

              }).join('')}
            </div>
          </div>
          <div class="two-col">
            <div class="field"><label>Height</label><input id="f-height" type="text" placeholder="5'4&quot;" value="${escapeHtml(p.height||'')}" /></div>

          </div>
          <div id="xmanNote" style="font-size:11.5px;color:#8f2f29;font-weight:600;margin:-4px 0 10px;${isXMan(p) ? '' : 'display:none;'}">
            ⚠ X-MAN (over 165 lb) — 8th grade rule: offensive line only on offense.
          </div>
          <div class="two-col">
            <div class="field"><label>40-yd dash (sec)</label><input id="f-speed" type="number" step="0.01" value="${p.speed40||''}" /></div>
            <div class="field"><label>Vertical jump (in)</label><input id="f-vert" type="number" step="0.1" value="${p.vertical||''}" /></div>
          </div>
          <div class="field"><label>Shuttle / agility (sec)</label><input id="f-shuttle" type="number" step="0.01" value="${p.shuttle||''}" /></div>
          <div class="field"><label>Parent / guardian name</label><input id="f-parentName" type="text" value="${escapeHtml(p.parentName||'')}" /></div>
          <div class="two-col">
            <div class="field"><label>Parent phone</label><input id="f-parentPhone" type="text" value="${escapeHtml(p.parentPhone||'')}" /></div>
            <div class="field"><label>Parent email</label><input id="f-parentEmail" type="text" value="${escapeHtml(p.parentEmail||'')}" /></div>
          </div>
          <div class="field"><label>Notes / other combine stats</label><textarea id="f-notes" placeholder="Bench reps, broad jump, coach comments…">${escapeHtml(p.notes||'')}</textarea></div>
          <div class="modal-actions">
            <div>${!isNew ? '<button class="danger" id="deleteBtn">Delete player</button>' : ''}</div>
            <div class="right">
              <button class="cancel" id="cancelBtn">Cancel</button>
              <button class="primary" id="saveBtn">${isNew ? 'Add player' : 'Save changes'}</button>

          </div>
        </div>
      </div>
    `;

    $('#f-weight').addEventListener('input', ()=>{
      const w = parseFloat($('#f-weight').value);
      $('#xmanNote').style.display = (!isNaN(w) && w > 165) ? 'block' : 'none';
    });

    let pendingPhotoAction = null;
    if(!isNew){
      try{
        window.storage.get(`photo_${id}`, true).then(res=>{
          if(res && res.value){
            $('#photoPreview').src = res.value;
            $('#photoPreview').style.display = 'block';
            $('#removePhotoBtn').style.display = 'inline-block';
          }
        }).catch(()=>{ /* no photo yet */ });
      }catch(e){ /* storage not available — profile still fully usable without a photo */ }
    }
    $('#f-photo').addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      resizeImageFile(file, 320).then(dataUrl=>{
        pendingPhotoAction = {type:'set', data:dataUrl};
        $('#photoPreview').src = dataUrl;
        $('#photoPreview').style.display = 'block';
        $('#removePhotoBtn').style.display = 'inline-block';
      }).catch(()=>{ showStatus('Could not read that image'); });
    });

      pendingPhotoAction = {type:'remove'};
      $('#photoPreview').style.display = 'none';
      $('#photoPreview').src = '';
      $('#removePhotoBtn').style.display = 'none';
    });

    let posState = {};
    POSITIONS.forEach(pos=>{
      if((p.positions||[]).includes(pos+'*')) posState[pos] = 'uncertain';
      else if((p.positions||[]).includes(pos)) posState[pos] = 'on';
      else posState[pos] = 'off';
    });
    $all('.pos-check', root).forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const pos = chip.dataset.pos;
        const next = posState[pos] === 'off' ? 'on' : posState[pos] === 'on' ? 'uncertain' : 'off';
        posState[pos] = next;
        chip.className = 'pos-check' + (next==='on' ? ' on' : next==='uncertain' ? ' uncertain' : '');
        chip.textContent = next==='uncertain' ? pos + '*' : pos;
      });
    });

    $('#modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
    $('#cancelBtn').addEventListener('click', closeModal);

    $('#saveBtn').addEventListener('click', async ()=>{
      const name = $('#f-name').value.trim();
      if(!name){ showStatus('Name is required'); return; }
      const positions = Object.keys(posState)
        .filter(k=>posState[k] !== 'off')
        .map(k=> posState[k] === 'uncertain' ? k + '*' : k);
      const data = {
        name,
        status: $('#f-status').value,
        team: $('#f-team').value,
        positions,
        height: $('#f-height').value.trim(),
        weight: $('#f-weight').value ? Number($('#f-weight').value) : '',
        speed40: $('#f-speed').value ? Number($('#f-speed').value) : '',
        vertical: $('#f-vert').value ? Number($('#f-vert').value) : '',
        shuttle: $('#f-shuttle').value ? Number($('#f-shuttle').value) : '',
        notes: $('#f-notes').value.trim(),
        parentName: $('#f-parentName').value.trim(),
        parentPhone: $('#f-parentPhone').value.trim(),
        parentEmail: $('#f-parentEmail').value.trim(),
      };
      let targetId = id;
      if(isNew){
        if(isTeamLocked(data.team)){
          showStatus(`${teamDisplayLabel(data.team)} is locked in — unlock it first to add players there`);
          return;
        }
        targetId = uid();
        const newPlayer = { id: targetId, prefs:{}, ...data };
        if(newPlayer.team !== 'pool' && !newPlayer.prefs[newPlayer.team]) newPlayer.prefs[newPlayer.team] = 'want';
        players.push(newPlayer);
        await savePlayers();
        addLog(`added ${newPlayer.name} to ${data.team==='pool'?'the pool':data.team}`);
      } else {
        const existing = players.find(pp=>pp.id===id);
        const teamChanged = existing.team !== data.team;
        if(teamChanged && (isTeamLocked(existing.team) || isTeamLocked(data.team))){
          const lockedLabel = isTeamLocked(existing.team) ? existing.team : data.team;
          showStatus(`${teamDisplayLabel(lockedLabel)} is locked in — unlock it first to move this player`);
          return;
        }
        Object.assign(existing, data);
        if(existing.team !== 'pool'){
          if(!existing.prefs) existing.prefs = {};
          if(!existing.prefs[existing.team]) existing.prefs[existing.team] = 'want';
        }
        await savePlayers();
        addLog(`updated ${existing.name}'s info${teamChanged ? ' and moved them to ' + (data.team==='pool'?'the pool':data.team) : ''}`);
      }
      if(pendingPhotoAction){
        try{
          if(pendingPhotoAction.type === 'set'){
            await window.storage.set(`photo_${targetId}`, pendingPhotoAction.data, true);
          } else if(pendingPhotoAction.type === 'remove'){
            await window.storage.delete(`photo_${targetId}`, true);
          }
        }catch(e){ showStatus('Saved player, but the photo failed to save'); }
      }
      closeModal();
      renderBoard();
    });

    if(!isNew){
      $('#deleteBtn').addEventListener('click', async ()=>{
        if(!confirm(`Remove ${p.name} from the board entirely? This can't be undone.`)) return;
        if(isTeamLocked(p.team)){
          showStatus(`${teamDisplayLabel(p.team)} is locked in — unlock it first to remove this player`);
          return;
        }
        players = players.filter(pp=>pp.id!==id);
        await savePlayers();
        try{ await window.storage.delete(`photo_${id}`, true); }catch(e){}
        addLog(`removed ${p.name} from the board`);
        closeModal();
        renderBoard();
      });
    }
  }

  function openImportModal(){
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
          <h3>Import players</h3>
          <div class="field">
            <label>Paste one player per line</label>
            <div style="font-size:12px;color:#5b5548;margin-bottom:6px;">
              Format: <code>Name</code> or <code>Name, new</code> / <code>Name, returning</code>. Defaults to "new" if not specified. All imported players land in the Pool.
            </div>
            <textarea class="import-textarea" id="importText" placeholder="Jaylen Moore, returning
Owen Baxter, new
Kai Sullivan"></textarea>
          </div>
          <div class="modal-actions">
            <div></div>
            <div class="right">
              <button class="cancel" id="cancelImport">Cancel</button>
              <button class="primary" id="doImport">Import</button>
            </div>
          </div>
        </div>
      </div>
    `;
    $('#modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
    $('#cancelImport').addEventListener('click', closeModal);
    $('#doImport').addEventListener('click', async ()=>{
      const raw = $('#importText').value;
      const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
      if(lines.length===0){ showStatus('Nothing to import'); return; }
      let count = 0;
      lines.forEach(line=>{
        const parts = line.split(',').map(s=>s.trim());
        const name = parts[0];
        if(!name) return;
        let status = 'new';
        if(parts[1] && /return/i.test(parts[1])) status = 'returning';
        else if(parts[1] && /new/i.test(parts[1])) status = 'new';
        players.push({ id: uid(), name, status, team:'pool', positions:[], height:'', weight:'', speed40:'', vertical:'', shuttle:'', notes:'', prefs:{} });
        count++;
      });
      await savePlayers();
      addLog(`imported ${count} player${count===1?'':'s'} into the pool`);
      closeModal();
      renderBoard();
      showStatus(`Imported ${count} players`);
    });
  }

  // ---------------- WIRING ----------------
  $('#addPlayerBtn').addEventListener('click', ()=> openEditModal(null));
  $('#importBtn').addEventListener('click', openImportModal);
  $('#tableViewBtn').addEventListener('click', ()=> setView(currentView === 'board' ? 'table' : 'board'));
  $('#logBtn').addEventListener('click', ()=>{
    renderLog();
    $('#logPanel').classList.add('open');
  });
  $('#closeLogBtn').addEventListener('click', ()=> $('#logPanel').classList.remove('open'));

  let coachSaveTimer = null;
  $('#coachInput').addEventListener('input', (e)=>{
    coachName = e.target.value;
    updateAffiliationUI();
    clearTimeout(coachSaveTimer);
    coachSaveTimer = setTimeout(async ()=>{
      try{ await window.storage.set('coach_name', coachName, false); }catch(err){}
    }, 500);
  });

  let affSaveTimer = null;
  $('#affiliationSelect').addEventListener('change', (e)=>{
    coachAffiliation = e.target.value;
    clearTimeout(affSaveTimer);
    affSaveTimer = setTimeout(async ()=>{
      try{ await window.storage.set('coach_affiliation', coachAffiliation, false); }catch(err){}
    }, 300);
  });

  // ---------------- PASSWORD GATE ----------------
  const SITE_PASSWORD = 'WLThunder2026!';

  async function initApp(){
    await loadAll();
    $('#loadingNote').style.display = 'none';
    $('#board').style.display = 'flex';
    $('#board').style.flexWrap = 'wrap';
    renderBoard();
    if(!hasIdentity()){
      openWelcomeIdentityModal(()=>{ /* nothing else needed — header + future actions now use the saved identity */ });
    }
  }

  function unlockGate(){
    $('#passwordGate').style.display = 'none';
    initApp();
  }

  $('#pwSubmit').addEventListener('click', async ()=>{
    const val = $('#pwInput').value;
    if(val === SITE_PASSWORD){
      try{ await window.storage.set('access_granted', 'true', false); }catch(e){}
      unlockGate();
    } else {
      $('#pwError').style.display = 'block';
      $('#pwInput').value = '';
      $('#pwInput').focus();
    }
  });
  $('#pwInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ $('#pwSubmit').click(); } });

  // ---------------- INIT ----------------
  (async function checkAccess(){
    try{
      const a = await window.storage.get('access_granted', false);
      if(a && a.value === 'true'){ unlockGate(); return; }
    }catch(e){ /* not granted yet, gate stays visible */ }
    $('#pwInput').focus();
  })();

})();
</script>
</body>
</html>
